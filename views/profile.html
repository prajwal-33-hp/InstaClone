<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini_insta – Profile</title><link rel="stylesheet" href="/css/style.css"><style>.profile-top{padding:1rem}.profile-pic-container{position:relative;width:94px}.profile-pic-container .story-ring{width:94px;height:94px}.profile-pic-input{display:none}.note-self{display:inline-block;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:.45rem .7rem;margin-bottom:.3rem;font-size:.8rem;position:relative;max-width:150px}.note-self:after{content:"";position:absolute;bottom:-6px;left:28px;border:7px solid transparent;border-top-color:var(--surface-2)}.profile-actions{display:flex;gap:.55rem;margin-top:1rem}.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:1rem}.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:.85rem}.tabs button.active{color:var(--text);border-bottom:2px solid var(--text)}.followers-list{display:flex;flex-direction:column;gap:.75rem;padding:1rem}.follower-row{display:flex;align-items:center;gap:.75rem}.follower-row .meta{flex:1}</style><script src="/js/theme.js"></script></head>
<body>
<nav class="navbar"><div class="nav-logo">Instagram</div><div class="nav-links"><a href="/home">🏠 Home</a><a href="/search">🔍 Search</a><a href="/reels">📹 Reels</a><a href="/profile" class="active">👤 Profile</a><a href="/chat">💬 Chat</a><a href="/settings">⚙️ Settings</a><button class="btn btn-sm btn-outline" onclick="logout()">Logout</button></div></nav>
<main class="main-layout">
<section class="card profile-card profile-top">
  <div class="profile-header">
    <div class="profile-pic-container" onclick="triggerFileInput()"><div id="profile-note" class="note-self hidden"></div><div id="profile-avatar" class="story-ring"><div class="fallback">?</div></div><input type="file" id="profile-pic-input" class="profile-pic-input" accept="image/*" onchange="handleProfilePicChange(event)"></div>
    <div class="profile-info"><div class="profile-username-row" onclick="openAcctSheet()"><h2 id="profile-username">Loading...</h2><span class="chev">▾</span></div><p id="profile-bio" class="profile-bio"></p><div class="profile-stats"><div><strong id="posts-count">0</strong><span>posts</span></div><div class="stat-link" onclick="openFollowList('followers')"><strong id="followers-count">0</strong><span>followers</span></div><div class="stat-link" onclick="openFollowList('following')"><strong id="following-count">0</strong><span>following</span></div></div><div class="profile-actions"><button class="btn btn-outline" onclick="toggleEdit()">Edit profile</button><button class="btn btn-outline" onclick="shareNote()">Share note</button><button class="btn btn-outline" onclick="location.href='/settings'">⚙</button></div></div>
  </div>
  <div id="edit-form" class="profile-edit-form hidden"><div class="form-group"><label>Username</label><input id="edit-username"></div><div class="form-group"><label>Bio</label><textarea id="edit-bio" rows="2"></textarea></div><button class="btn btn-primary btn-sm" onclick="saveProfile()">Save</button><div id="profile-msg" class="success-msg hidden"></div></div>
  <div class="tabs"><button id="tab-posts" class="active" onclick="setTab('all')">▦ Posts</button><button id="tab-reels" onclick="setTab('reels')">▻ Reels</button></div>
</section>
<section id="my-posts" class="profile-grid"></section>
</main>
<div id="follow-modal" class="modal-overlay hidden"><div class="modal"><div class="modal-header"><h3 id="follow-title">Followers</h3><button onclick="closeFollowList()">✕</button></div><div id="follow-list" class="followers-list"></div></div></div>
<div id="acct-sheet" class="sheet-overlay" onclick="if(event.target===this)closeAcctSheet()"><div class="sheet"><div class="sheet-handle"></div><h3 id="sheet-title">Accounts</h3><div id="acct-list"></div><div class="ig-divider"></div><div class="ig-row link-blue" onclick="location.href='/register'"><div class="ig-icon">＋</div><div class="ig-text"><b>Add account</b><span>Sign up or log in to another account</span></div></div><div class="ig-row" onclick="location.href='/login'"><div class="ig-icon">↪</div><div class="ig-text"><b>Log in to existing account</b></div></div><div class="ig-row danger" onclick="logout()"><div class="ig-icon">⏻</div><div class="ig-text"><b>Log out</b></div></div></div></div>
<nav class="bottom-nav"><a href="/home">⌂</a><a href="/reels">▻</a><a href="/chat">✈</a><a href="/search">⌕</a><a href="/profile" class="active">◉</a></nav>
<script>
let currentUser=null,posts=[],tab='all';async function init(){const res=await fetch('/api/auth/me');if(!res.ok)return location.href='/login';currentUser=await res.json();renderProfile();await loadNotes();await loadPosts()}
function renderProfile(){document.getElementById('profile-username').textContent=currentUser.username;document.getElementById('profile-bio').textContent=currentUser.bio||'No bio yet.';document.getElementById('followers-count').textContent=(currentUser.followers||[]).length;document.getElementById('following-count').textContent=(currentUser.following||[]).length;document.getElementById('edit-username').value=currentUser.username;document.getElementById('edit-bio').value=currentUser.bio||'';document.getElementById('profile-avatar').innerHTML=currentUser.profilePic&&currentUser.profilePic!=='default-avatar.png'?`<img src="${currentUser.profilePic}">`:`<div class="fallback">${currentUser.username[0].toUpperCase()}</div>`}
async function loadNotes(){const r=await fetch(`/api/notes/user/${currentUser._id}`);if(!r.ok)return;const notes=await r.json();const n=notes[0],el=document.getElementById('profile-note');if(n){el.textContent=n.content;el.classList.remove('hidden')}else{el.textContent='Your thoughts go here...';el.classList.remove('hidden')}}
async function shareNote(){const content=prompt('Share a note that others can react to:');if(!content)return;await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,isPublic:true})});loadNotes()}
async function loadPosts(){const r=await fetch(`/api/posts/user/${currentUser._id}`);posts=await r.json();document.getElementById('posts-count').textContent=posts.length;renderPosts()}
function setTab(t){tab=t;document.getElementById('tab-posts').classList.toggle('active',t==='all');document.getElementById('tab-reels').classList.toggle('active',t==='reels');renderPosts()}
function renderPosts(){const list=tab==='reels'?posts.filter(p=>p.video):posts;const el=document.getElementById('my-posts');if(!list.length){el.innerHTML='<p class="empty-state" style="grid-column:1/-1">No '+(tab==='reels'?'reels':'posts')+' yet.</p>';return}el.innerHTML=list.map(p=>`<div class="profile-grid-item" onclick="location.href='/home#post-${p._id}'">${p.video?`<video src="${p.video}" controls playsinline></video><span class="play-badge">▶</span>`:`<img src="${p.image||'/placeholder.svg'}" alt="post">`}</div>`).join('')}
function triggerFileInput(){document.getElementById('profile-pic-input').click()}async function handleProfilePicChange(e){const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('profilePicture',f);const r=await fetch('/api/auth/upload-profile-pic',{method:'POST',body:fd});const d=await r.json();if(r.ok){currentUser=d.user;renderProfile()}else alert(d.error||'Upload failed')}
function toggleEdit(){document.getElementById('edit-form').classList.toggle('hidden')}async function saveProfile(){const username=document.getElementById('edit-username').value.trim(),bio=document.getElementById('edit-bio').value.trim();const r=await fetch('/api/auth/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,bio})});const d=await r.json();if(r.ok){currentUser=d;renderProfile();toggleEdit()}else alert(d.error||'Save failed')}
async function openFollowList(type){document.getElementById('follow-title').textContent=type==='followers'?'Followers':'Following';document.getElementById('follow-modal').classList.remove('hidden');const r=await fetch(`/api/auth/user/${currentUser._id}/${type}`);const users=await r.json();document.getElementById('follow-list').innerHTML=users.length?users.map(u=>`<div class="follower-row" onclick="viewProfile('${u._id}')"><div class="avatar sm">${u.profilePic&&u.profilePic!=='default-avatar.png'?`<img src="${u.profilePic}">`:u.username[0].toUpperCase()}</div><div class="meta"><b>${esc(u.username)}</b><span class="text-muted">${esc(u.bio||'')}</span></div></div>`).join(''):'<p class="empty-state">No users yet.</p>'}
function closeFollowList(){document.getElementById('follow-modal').classList.add('hidden')}function viewProfile(id){location.href=id===currentUser._id?'/profile':`/user/${id}`}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function openAcctSheet(){const list=document.getElementById('acct-list');const saved=JSON.parse(localStorage.getItem('savedAccounts')||'[]');const me={_id:currentUser._id,username:currentUser.username,profilePic:currentUser.profilePic};if(!saved.find(a=>a._id===me._id))saved.unshift(me);localStorage.setItem('savedAccounts',JSON.stringify(saved));document.getElementById('sheet-title').textContent=currentUser.username;list.innerHTML=saved.map(a=>`<div class="ig-row"><div class="acct-pic">${a.profilePic&&a.profilePic!=='default-avatar.png'?`<img src="${a.profilePic}">`:a.username[0].toUpperCase()}</div><div class="ig-text"><b>${esc(a.username)}</b>${a._id===currentUser._id?'<span>Currently logged in</span>':''}</div>${a._id===currentUser._id?'<span style="color:#0095f6">✓</span>':'<span class="ig-arrow">›</span>'}</div>`).join('');document.getElementById('acct-sheet').classList.add('show')}
function closeAcctSheet(){document.getElementById('acct-sheet').classList.remove('show')}
init();
</script></body></html>

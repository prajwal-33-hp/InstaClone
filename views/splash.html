<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini_insta</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html,body{height:100%;margin:0}
  body.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;animation:fade .35s ease}
  .splash-logo{font-size:3.6rem;font-weight:900;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;animation:pop .8s cubic-bezier(.2,1.3,.4,1)}
  .splash-tag{margin-top:.5rem;color:var(--muted);font-weight:600}
  .splash-meta{position:absolute;bottom:2.4rem;color:var(--muted);font-size:.85rem;text-align:center;width:100%}
  .splash-meta b{display:block;color:var(--text);font-weight:800;letter-spacing:.6px}
  .spinner{margin-top:1.6rem;width:30px;height:30px;border:3px solid rgba(255,255,255,.18);border-top-color:#d62976;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<script src="/js/theme.js"></script></head>
<body class="splash">
  <div class="splash-logo">Mini_insta</div>
  <div class="splash-tag">Loading your feed…</div>
  <div class="spinner"></div>
  <div class="splash-meta"><span>from</span><b>META</b></div>
<script>
  // Apply saved theme so splash matches user preference
  (function(){const t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=t})();
  setTimeout(()=>location.href='/home',2000);
</script>
</body>
</html>

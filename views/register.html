<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMinsta – Register</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script></head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-logo">
    <h1>📸 GMinsta</h1>
    <p>Join the community</p>
  </div>
  <div class="auth-card">
    <h2>Create Account</h2>
    <div id="error-msg" class="error-msg hidden"></div>
    <div id="success-msg" class="success-msg hidden"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="cooluser123" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password <span class="hint">(min. 6 chars)</span></label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Bio <span class="hint">(optional)</span></label>
      <textarea id="bio" placeholder="Tell us about yourself..." rows="2"></textarea>
    </div>
    <button class="btn btn-primary" onclick="register()">Create Account</button>
    <p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>
  </div>
</div>
<script>
async function register() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const bio      = document.getElementById('bio').value.trim();

  if (!username || !email || !password) { showError('Username, email and password are required.'); return; }
  if (username.length < 3)              { showError('Username must be at least 3 characters.'); return; }
  if (password.length < 6)             { showError('Password must be at least 6 characters.'); return; }
  if (password !== confirm)             { showError('Passwords do not match.'); return; }

  const res  = await fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password, bio })
  });
  const data = await res.json();
  if (!res.ok) { showError(data.error); return; }
  showSuccess('Account created! Redirecting...');
  setTimeout(() => window.location.href = '/home', 1200);
}

function showError(msg)   { const e = document.getElementById('error-msg');   e.textContent = msg; e.classList.remove('hidden'); document.getElementById('success-msg').classList.add('hidden'); }
function showSuccess(msg) { const e = document.getElementById('success-msg'); e.textContent = msg; e.classList.remove('hidden'); document.getElementById('error-msg').classList.add('hidden'); }
</script>
</body>
</html>

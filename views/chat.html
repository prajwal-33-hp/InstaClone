<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini_insta – Messages</title><link rel="stylesheet" href="/css/style.css"><style>.chat-title{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.1rem}.note-name{font-size:.78rem;text-align:center;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-create{min-width:82px;text-align:center}.note-create .note-bubble{border-style:dashed;color:var(--muted)}@media(max-width:760px){.chat-layout.chat-open .bottom-back{display:inline-flex}.bottom-back{display:none}}</style><script src="/js/theme.js"></script></head>
<body>
<nav class="navbar"><div class="nav-logo" id="chat-logo">Messages</div><div class="nav-links"><a href="/home">🏠 Home</a><a href="/search">🔍 Search</a><a href="/reels">📹 Reels</a><a href="/profile">👤 Profile</a><a href="/chat" class="active">💬 Chat</a><button class="btn btn-sm btn-outline" onclick="logout()">Logout</button></div></nav>
<div class="chat-layout" id="chat-layout">
  <aside class="chat-sidebar"><div class="chat-title"><h2 id="my-name">Messages</h2><button class="btn-icon" onclick="createNote()">✎</button></div><div id="notes-rail" class="notes-rail"></div><h3>Chats</h3><div id="user-list" class="user-list"></div></aside>
  <main class="chat-main"><div id="chat-header" class="chat-header"><button class="btn-icon bottom-back" onclick="closeMobileChat()">‹</button><p class="empty-state">Select a user to start chatting</p></div><div id="messages-area" class="messages-area"></div><div id="attach-preview" class="attach-preview"></div><div id="chat-input-row" class="chat-input-row hidden"><label class="attach-btn" title="Attach file">📎<input type="file" id="attach-input" class="attach-input" accept="image/*,video/*,application/pdf,.doc,.docx,.txt,.zip" onchange="onAttachChosen(event)"></label><input type="text" id="msg-input" placeholder="Message..."><button class="btn btn-primary" onclick="sendMessage()">Send</button></div></main>
</div>
<nav class="bottom-nav"><a href="/home">⌂</a><a href="/reels">▻</a><a href="/chat" class="active">✈</a><a href="/search">⌕</a><a href="/profile">◉</a></nav>
<script>
let currentUser=null,chatWith=null,pollInterval=null,pendingFile=null,users=[];async function init(){const r=await fetch('/api/auth/me');if(!r.ok)return location.href='/login';currentUser=await r.json();document.getElementById('my-name').textContent=currentUser.username;await Promise.all([loadUsers(),loadNotes()]);const u=new URLSearchParams(location.search).get('user');if(u)setTimeout(()=>{const x=users.find(v=>v._id===u);if(x)openChat(x._id,x.username,x.profilePic)},250)}
function avatar(u,cls='avatar sm'){return `<div class="${cls}">${u.profilePic&&u.profilePic!=='default-avatar.png'?`<img src="${u.profilePic}">`:(u.username||'?')[0].toUpperCase()}</div>`}
async function loadNotes(){const r=await fetch('/api/notes/feed');if(!r.ok)return;const notes=await r.json();const mine=notes.find(n=>n.isMine);let html=`<div class="note-create" onclick="createNote()"><div class="note-bubble">${mine?esc(mine.content):'Your thoughts go here...'}</div>${avatar(currentUser,'note-avatar')}<div class="note-name">Your note</div></div>`;html+=notes.filter(n=>!n.isMine).map(n=>`<div class="note-pill" onclick="reactNote('${n._id}')"><div class="note-bubble">${esc(n.content)}</div>${avatar(n.userId,'note-avatar')}<div class="note-name">${esc(n.userId.username)} · ❤️ ${n.likesCount||0}</div></div>`).join('');document.getElementById('notes-rail').innerHTML=html}
async function createNote(){const content=prompt('Share a note:');if(!content)return;await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,isPublic:true})});loadNotes()}
async function reactNote(id){await fetch(`/api/notes/${id}/react`,{method:'POST'});loadNotes()}
async function loadUsers(){const r=await fetch('/api/auth/users');users=await r.json();const list=document.getElementById('user-list');list.innerHTML=users.length?users.map(u=>`<div class="user-item" id="user-item-${u._id}" onclick="openChat('${u._id}','${escAttr(u.username)}','${escAttr(u.profilePic||'')}')">${avatar(u)}<div><strong>${esc(u.username)}</strong><span>${esc(u.bio||'Tap to message')}</span></div></div>`).join(''):'<p class="empty-state">No other users yet.</p>'}
function openChat(id,name,pic){chatWith=id;document.getElementById('chat-layout').classList.add('chat-open');document.getElementById('chat-header').innerHTML=`<button class="btn-icon bottom-back" onclick="closeMobileChat()">‹</button><div class="avatar sm">${pic&&pic!=='default-avatar.png'?`<img src="${pic}">`:name[0].toUpperCase()}</div><strong>${esc(name)}</strong>`;document.getElementById('chat-input-row').classList.remove('hidden');document.querySelectorAll('.user-item').forEach(e=>e.classList.remove('active'));document.getElementById('user-item-'+id)?.classList.add('active');loadMessages();if(pollInterval)clearInterval(pollInterval);pollInterval=setInterval(loadMessages,1500)}function closeMobileChat(){document.getElementById('chat-layout').classList.remove('chat-open')}
function renderAttachment(a){if(!a||!a.url)return'';if(a.kind==='image')return`<img src="${a.url}" alt="image">`;if(a.kind==='video')return`<video src="${a.url}" controls playsinline></video>`;return`<a class="file-link" href="${a.url}" target="_blank">📎 ${esc(a.fileName||'Download file')}</a>`}
async function loadMessages(){if(!chatWith)return;const r=await fetch(`/api/chat/conversation/${chatWith}`);const msgs=await r.json();const area=document.getElementById('messages-area');if(!msgs.length){area.innerHTML='<p class="empty-state">Say hello 👋</p>';return}area.innerHTML=msgs.map(m=>{const me=m.senderId._id===currentUser._id;return`<div class="message ${me?'me':'them'}"><div class="bubble">${m.messageText?esc(m.messageText):''}${renderAttachment(m.attachment)}</div><span class="msg-time">${timeAgo(m.createdAt)}</span></div>`}).join('');area.scrollTop=area.scrollHeight}
function onAttachChosen(e){const f=e.target.files[0];if(!f)return;if(f.size>50*1024*1024){alert('File must be under 50MB');e.target.value='';return}pendingFile=f;const prev=document.getElementById('attach-preview');let thumb='📎';if(f.type.startsWith('image/'))thumb=`<img src="${URL.createObjectURL(f)}">`;else if(f.type.startsWith('video/'))thumb=`<video src="${URL.createObjectURL(f)}" muted></video>`;prev.innerHTML=`${thumb}<div><b>${esc(f.name)}</b><br><small>${(f.size/1024).toFixed(1)} KB</small></div><button class="clear" onclick="clearAttach()">✕</button>`;prev.classList.add('show')}
function clearAttach(){pendingFile=null;document.getElementById('attach-input').value='';const p=document.getElementById('attach-preview');p.classList.remove('show');p.innerHTML=''}
async function sendMessage(){const text=document.getElementById('msg-input').value.trim();if(!chatWith||(!text&&!pendingFile))return;const fd=new FormData();fd.append('receiverId',chatWith);fd.append('messageText',text);if(pendingFile)fd.append('attachment',pendingFile);const r=await fetch('/api/chat/send',{method:'POST',body:fd});if(!r.ok){const d=await r.json().catch(()=>({}));return alert(d.error||'Send failed')}document.getElementById('msg-input').value='';clearAttach();loadMessages()}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}function timeAgo(d){const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function escAttr(t=''){return esc(t).replace(/'/g,'&#39;')}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='msg-input')sendMessage()});init();
</script></body></html>

<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini_insta – Search</title><link rel="stylesheet" href="/css/style.css"><script src="/js/theme.js"></script></head>
<body>
<nav class="navbar"><div class="nav-logo">Instagram</div><div class="nav-links"><a href="/home">🏠 Home</a><a href="/search" class="active">🔍 Search</a><a href="/reels">📹 Reels</a><a href="/profile">👤 Profile</a><a href="/chat">💬 Chat</a><a href="/settings">⚙️ Settings</a><button class="btn btn-sm btn-outline" onclick="logout()">Logout</button></div></nav>
<main class="search-container"><input id="search-input" class="search-input" placeholder="Search users, posts and reels" oninput="renderAll()"><div class="filter-tabs"><button class="filter-btn active" onclick="setFilter('all',event)">All</button><button class="filter-btn" onclick="setFilter('users',event)">Users</button><button class="filter-btn" onclick="setFilter('reels',event)">Reels</button><button class="filter-btn" onclick="setFilter('posts',event)">Posts</button></div><section id="users-container" class="users-grid"></section><section id="posts-grid" class="post-grid"></section></main>
<nav class="bottom-nav"><a href="/home">⌂</a><a href="/reels">▻</a><a href="/chat">✈</a><a href="/search" class="active">⌕</a><a href="/profile">◉</a></nav>
<script>
let currentUser=null,users=[],posts=[],filter='all';async function init(){let r=await fetch('/api/auth/me');if(!r.ok)return location.href='/login';currentUser=await r.json();await Promise.all([loadUsers(),loadPosts()]);renderAll()}
async function loadUsers(){const r=await fetch('/api/auth/users');users=await r.json()}async function loadPosts(){const r=await fetch('/api/posts');posts=await r.json()}function setFilter(f,e){filter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');renderAll()}
function renderAll(){const q=document.getElementById('search-input').value.toLowerCase().trim();let fu=users.filter(u=>!q||u.username.toLowerCase().includes(q)||(u.bio||'').toLowerCase().includes(q));let fp=posts.filter(p=>!q||(p.caption||'').toLowerCase().includes(q)||(p.userId?.username||'').toLowerCase().includes(q));if(filter==='users'){renderUsers(fu);renderPosts([]);return}if(filter==='reels'){renderUsers([]);renderPosts(fp.filter(p=>p.video));return}if(filter==='posts'){renderUsers([]);renderPosts(fp);return}renderUsers(fu);renderPosts(fp)}
function renderUsers(list){const el=document.getElementById('users-container');if(!list.length){el.innerHTML='';return}el.innerHTML=list.map(u=>{const isFollowing=(currentUser.following||[]).includes(u._id);return `<article class="user-card"><div class="user-avatar" onclick="viewProfile('${u._id}')">${u.profilePic&&u.profilePic!=='default-avatar.png'?`<img src="${u.profilePic}">`:u.username[0].toUpperCase()}${u.hasActiveStory?'<span class="story-dot"></span>':''}</div><h3>${esc(u.username)}</h3><p class="text-muted">${esc(u.bio||'No bio')}</p><div class="profile-stats" style="justify-content:center"><div><strong>${u.postsCount||0}</strong><span>posts</span></div><div><strong>${(u.followers||[]).length}</strong><span>followers</span></div></div><button class="btn ${isFollowing?'btn-outline':'btn-primary'} btn-sm" onclick="toggleFollow('${u._id}')">${isFollowing?'Following':'Follow'}</button><button class="btn btn-outline btn-sm" onclick="viewProfile('${u._id}')" style="margin-left:.35rem">View profile</button></article>`}).join('')}
function renderPosts(list){const el=document.getElementById('posts-grid');if(!list.length){el.innerHTML=(filter==='posts'||filter==='reels')?'<p class="empty-state" style="grid-column:1/-1">No results</p>':'';return}el.innerHTML=list.map(p=>`<div class="post-grid-item" onclick="${p.video?"location.href='/reels'":"location.href='/home#post-"+p._id+"'"}">${p.video?`<video src="${p.video}" muted playsinline></video><span class="grid-label">▶ ${p.likesCount||0}</span>`:`<img src="${p.image||'/placeholder.svg'}"><span class="grid-label">♡ ${p.likesCount||0}</span>`}</div>`).join('')}
async function toggleFollow(id){await fetch(`/api/auth/follow/${id}`,{method:'POST'});await loadUsers();const r=await fetch('/api/auth/me');currentUser=await r.json();renderAll()}function viewProfile(id){location.href=id===currentUser._id?'/profile':`/user/${id}`}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}init();
</script></body></html>

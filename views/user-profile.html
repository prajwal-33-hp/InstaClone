<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini_insta – User Profile</title><link rel="stylesheet" href="/css/style.css"><style>.profile-header-section{padding:1rem}.profile-actions{display:flex;gap:.55rem;margin-top:1rem}.tabs{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:1rem}.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:.85rem}.tabs button.active{color:var(--text);border-bottom:2px solid var(--text)}.note-self{display:inline-block;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:.45rem .7rem;margin-bottom:.3rem;font-size:.8rem;max-width:155px;position:relative}.note-self:after{content:"";position:absolute;bottom:-6px;left:28px;border:7px solid transparent;border-top-color:var(--surface-2)}.followers-list{display:flex;flex-direction:column;gap:.75rem;padding:1rem}.follower-row{display:flex;align-items:center;gap:.75rem}.follower-row .meta{flex:1}</style><script src="/js/theme.js"></script></head>
<body>
<nav class="navbar"><div class="nav-logo">Instagram</div><div class="nav-links"><a href="/home">🏠 Home</a><a href="/search">🔍 Search</a><a href="/reels">📹 Reels</a><a href="/profile">👤 Profile</a><a href="/chat">💬 Chat</a><button class="btn btn-sm btn-outline" onclick="logout()">Logout</button></div></nav>
<main class="main-layout"><a href="/search" class="btn btn-outline btn-sm" style="margin-bottom:.8rem">← Back</a><section id="profile-container" class="card profile-card profile-header-section"></section><section id="posts-feed" class="profile-grid"></section></main>
<div id="follow-modal" class="modal-overlay hidden"><div class="modal"><div class="modal-header"><h3 id="follow-title">Followers</h3><button onclick="closeFollowList()">✕</button></div><div id="follow-list" class="followers-list"></div></div></div>
<nav class="bottom-nav"><a href="/home">⌂</a><a href="/reels">▻</a><a href="/chat">✈</a><a href="/search" class="active">⌕</a><a href="/profile">◉</a></nav>
<script>
let currentUser=null,profileUser=null,posts=[],tab='all';async function init(){let r=await fetch('/api/auth/me');if(!r.ok)return location.href='/login';currentUser=await r.json();loadProfile(location.pathname.split('/').pop())}
async function loadProfile(id){const r=await fetch(`/api/auth/user/${id}`);if(!r.ok){document.getElementById('profile-container').innerHTML='<p class="empty-state">User not found.</p>';return}profileUser=await r.json();await loadNotes();await loadPosts();renderProfile()}
async function loadNotes(){const r=await fetch(`/api/notes/user/${profileUser._id}`);profileUser.notes=r.ok?await r.json():[]}
function renderProfile(){const isOwn=currentUser._id===profileUser._id;if(isOwn)return location.href='/profile';const isFollowing=(currentUser.following||[]).includes(profileUser._id);const av=profileUser.profilePic&&profileUser.profilePic!=='default-avatar.png'?`<img src="${profileUser.profilePic}">`:`<div class="fallback">${profileUser.username[0].toUpperCase()}</div>`;document.getElementById('profile-container').innerHTML=`<div class="profile-header"><div><div class="note-self ${profileUser.notes&&profileUser.notes[0]?'':'hidden'}">${esc(profileUser.notes?.[0]?.content||'')}</div><div class="story-ring ${profileUser.hasActiveStory?'unseen':''}" onclick="openStories()">${av}</div></div><div class="profile-info"><h2>${esc(profileUser.username)}</h2><p class="profile-bio">${esc(profileUser.bio||'No bio yet')}</p><div class="profile-stats"><div><strong id="posts-count">${posts.length}</strong><span>posts</span></div><div class="stat-link" onclick="openFollowList('followers')"><strong>${(profileUser.followers||[]).length}</strong><span>followers</span></div><div class="stat-link" onclick="openFollowList('following')"><strong>${(profileUser.following||[]).length}</strong><span>following</span></div></div><div class="profile-actions"><button class="btn ${isFollowing?'btn-outline':'btn-primary'}" onclick="toggleFollow()">${isFollowing?'Following':'Follow'}</button><button class="btn btn-outline" onclick="openChat()">Message</button></div></div></div><div class="tabs"><button id="tab-posts" class="active" onclick="setTab('all')">▦ Posts</button><button id="tab-reels" onclick="setTab('reels')">▻ Reels</button></div>`}
async function loadPosts(){const r=await fetch(`/api/posts/user/${profileUser._id}`);posts=await r.json();renderPosts()}
function setTab(t){tab=t;document.getElementById('tab-posts').classList.toggle('active',t==='all');document.getElementById('tab-reels').classList.toggle('active',t==='reels');renderPosts()}function renderPosts(){const list=tab==='reels'?posts.filter(p=>p.video):posts;document.getElementById('posts-feed').innerHTML=list.length?list.map(p=>`<div class="profile-grid-item">${p.video?`<video src="${p.video}" controls playsinline></video><span class="play-badge">▶</span>`:`<img src="${p.image||'/placeholder.svg'}" alt="post">`}</div>`).join(''):'<p class="empty-state" style="grid-column:1/-1">No '+(tab==='reels'?'reels':'posts')+' yet.</p>'}
async function toggleFollow(){const r=await fetch(`/api/auth/follow/${profileUser._id}`,{method:'POST'});if(r.ok){const d=await r.json();if(d.isFollowing)currentUser.following.push(profileUser._id);else currentUser.following=currentUser.following.filter(x=>x!==profileUser._id);await loadProfile(profileUser._id)}}
function openChat(){location.href=`/chat?user=${profileUser._id}`}function openStories(){location.href='/home'}
async function openFollowList(type){document.getElementById('follow-title').textContent=type==='followers'?'Followers':'Following';document.getElementById('follow-modal').classList.remove('hidden');const r=await fetch(`/api/auth/user/${profileUser._id}/${type}`);const users=await r.json();document.getElementById('follow-list').innerHTML=users.length?users.map(u=>`<div class="follower-row" onclick="location.href='/user/${u._id}'"><div class="avatar sm">${u.profilePic&&u.profilePic!=='default-avatar.png'?`<img src="${u.profilePic}">`:u.username[0].toUpperCase()}</div><div class="meta"><b>${esc(u.username)}</b><span class="text-muted">${esc(u.bio||'')}</span></div></div>`).join(''):'<p class="empty-state">No users yet.</p>'}function closeFollowList(){document.getElementById('follow-modal').classList.add('hidden')}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}init();
</script></body></html>

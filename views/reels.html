<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini_insta – Reels</title><link rel="stylesheet" href="/css/style.css">
<style>
  body{overflow:hidden;background:#000}.reels-page{height:100vh;display:flex;flex-direction:column}.reels-header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)}.reels-header h1{font-size:1.35rem}.reels-viewport{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}.reels-viewport::-webkit-scrollbar{width:0}.reel{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}.reel video{width:100%;height:100%;object-fit:contain;background:#000}.reel-info{position:absolute;left:1rem;right:5.4rem;bottom:5.2rem;color:#fff;text-shadow:0 1px 6px #000;z-index:4}.reel-user{display:flex;align-items:center;gap:.55rem;margin-bottom:.65rem;font-weight:850}.reel-user .avatar{width:38px;height:38px;border:2px solid #fff}.reel-actions{position:absolute;right:.8rem;bottom:5rem;display:flex;flex-direction:column;gap:1rem;align-items:center;z-index:5}.reel-action{background:rgba(0,0,0,.38);border:none;color:#fff;border-radius:999px;min-width:54px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.55rem}.reel-action small{font-size:.75rem}.create-reel{position:fixed;right:1rem;top:4.2rem;z-index:35}.upload-panel{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--surface);border-top:1px solid var(--border);padding:1rem;display:none}.upload-panel.show{display:block}.upload-panel textarea{margin:.6rem 0;min-height:72px}.bottom-nav{z-index:70}.comments-modal .modal{max-height:70vh}
</style>
<script src="/js/theme.js"></script></head>
<body>
<div class="reels-page">
  <header class="reels-header"><button class="btn-icon" onclick="location.href='/home'">‹</button><h1>Reels</h1><button class="btn-icon" onclick="openUpload()">＋</button></header>
  <button class="btn btn-primary create-reel" onclick="openUpload()">Upload reel</button>
  <main id="reels" class="reels-viewport"></main>
</div>
<div id="upload-panel" class="upload-panel"><h3>Upload reel</h3><input type="file" id="reel-file" accept="video/*"><textarea id="reel-caption" placeholder="Write a caption..."></textarea><div style="display:flex;gap:.5rem"><button class="btn btn-primary" onclick="uploadReel()">Share reel</button><button class="btn btn-outline" onclick="closeUpload()">Cancel</button></div><div id="upload-error" class="error-msg hidden"></div></div>
<div id="comment-modal" class="modal-overlay hidden comments-modal"><div class="modal"><div class="modal-header"><h3>Comments</h3><button onclick="closeComments()">✕</button></div><div id="comments-list" class="comments-list"></div><div class="comment-input-row"><input id="comment-text" placeholder="Add a comment..."><button class="btn btn-primary btn-sm" onclick="addComment()">Post</button></div></div></div>
<nav class="bottom-nav"><a href="/home">⌂</a><a href="/reels" class="active">▻</a><a href="/chat">✈</a><a href="/search">⌕</a><a href="/profile">◉</a></nav>
<script>
let currentUser=null,reels=[],currentPostId=null;
async function init(){const r=await fetch('/api/auth/me');if(!r.ok)return location.href='/login';currentUser=await r.json();loadReels()}
function avatar(u){return `<div class="avatar">${u.profilePic&&u.profilePic!=='default-avatar.png'?`<img src="${u.profilePic}">`:(u.username||'?')[0].toUpperCase()}</div>`}
async function loadReels(){const r=await fetch('/api/posts/reels');reels=await r.json();const el=document.getElementById('reels');if(!reels.length){el.innerHTML='<section class="reel"><div class="empty-state" style="color:#fff"><h2>No reels yet</h2><p>Upload your first video reel.</p><button class="btn btn-primary" onclick="openUpload()">Upload reel</button></div></section>';return}el.innerHTML=reels.map(renderReel).join('');setupAutoplay()}
function renderReel(p){return `<section class="reel" data-id="${p._id}"><video src="${p.video}" controls loop playsinline preload="metadata"></video><div class="reel-info"><div class="reel-user" onclick="viewProfile('${p.userId._id}')">${avatar(p.userId)}<span>${esc(p.userId.username)}</span></div><p>${esc(p.caption||'')}</p></div><div class="reel-actions"><button class="reel-action ${p.likedByMe?'active':''}" onclick="likeReel('${p._id}')">${p.likedByMe?'❤️':'♡'}<small>${p.likesCount||0}</small></button><button class="reel-action" onclick="openComments('${p._id}')">💬<small>${p.commentsCount||0}</small></button><button class="reel-action" onclick="viewProfile('${p.userId._id}')">◉</button></div></section>`}
function setupAutoplay(){const obs=new IntersectionObserver(entries=>entries.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;if(e.isIntersecting){v.play().catch(()=>{})}else v.pause()}),{threshold:.65});document.querySelectorAll('.reel').forEach(x=>obs.observe(x))}
function openUpload(){document.getElementById('upload-panel').classList.add('show')}function closeUpload(){document.getElementById('upload-panel').classList.remove('show')}
async function uploadReel(){const f=document.getElementById('reel-file').files[0],cap=document.getElementById('reel-caption').value.trim(),err=document.getElementById('upload-error');err.classList.add('hidden');if(!f||!f.type.startsWith('video/')){err.textContent='Choose a video file.';err.classList.remove('hidden');return}if(f.size>50*1024*1024){err.textContent='Video must be under 50MB.';err.classList.remove('hidden');return}const fd=new FormData();fd.append('media',f);fd.append('caption',cap);const r=await fetch('/api/posts',{method:'POST',body:fd});const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=d.error||'Upload failed';err.classList.remove('hidden');return}document.getElementById('reel-file').value='';document.getElementById('reel-caption').value='';closeUpload();loadReels()}
async function likeReel(id){await fetch(`/api/posts/${id}/like`,{method:'POST'});loadReels()}
function openComments(id){currentPostId=id;document.getElementById('comment-modal').classList.remove('hidden');loadComments(id)}function closeComments(){document.getElementById('comment-modal').classList.add('hidden')}
async function loadComments(id){const r=await fetch(`/api/comments/${id}`);const arr=await r.json();document.getElementById('comments-list').innerHTML=arr.length?arr.map(c=>`<div class="comment">${avatar(c.userId).replace('avatar','avatar sm')}<div><b>${esc(c.userId.username)}</b><span class="comment-text">${esc(c.commentText)}</span></div></div>`).join(''):'<p class="empty-state">No comments yet.</p>'}
async function addComment(){const i=document.getElementById('comment-text'),text=i.value.trim();if(!text)return;await fetch(`/api/comments/${currentPostId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({commentText:text})});i.value='';loadComments(currentPostId);loadReels()}
function viewProfile(id){location.href=id===currentUser._id?'/profile':`/user/${id}`}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}init();
</script>
</body>
</html>
